<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Pocket — Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FAF8F5] text-slate-700 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#6C5B7B] tracking-tight flex items-center justify-center gap-2">
                ✨ Pastel Pocket 
            </h1>
            <p class="text-slate-400 text-sm mt-1">Kelola keuanganmu dengan lebih ceria dan teratur!</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-[#F3E5F5] p-6 rounded-2xl shadow-sm border border-[#E1BEE7]">
                <h3 class="text-xs font-semibold text-[#8E24AA] uppercase tracking-wider">Sisa Uangku</h3>
                <p id="total-balance" class="text-2xl font-bold text-[#4A148C] mt-1">Rp 0</p>
            </div>
            <div class="bg-[#E8F5E9] p-6 rounded-2xl shadow-sm border border-[#C8E6C9]">
                <h3 class="text-xs font-semibold text-[#388E3C] uppercase tracking-wider">Pemasukan</h3>
                <p id="total-income" class="text-2xl font-bold text-[#1B5E20] mt-1">Rp 0</p>
            </div>
            <div class="bg-[#FFEBEE] p-6 rounded-2xl shadow-sm border border-[#FFCDD2]">
                <h3 class="text-xs font-semibold text-[#D32F2F] uppercase tracking-wider">Pengeluaran</h3>
                <p id="total-expense" class="text-2xl font-bold text-[#B71C1C] mt-1">Rp 0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-8">
            
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    ✍️ Catat Transaksi
                </h2>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Nama Transaksi</label>
                        <input type="text" id="tx-title" placeholder="Misal: Beli Matcha Latte" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#D1C4E9] bg-slate-50/50 text-sm">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Nominal (Rp)</label>
                        <input type="number" id="tx-amount" placeholder="Nominal angka saja" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#D1C4E9] bg-slate-50/50 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Jenis</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2.5 text-center block text-sm font-medium has-[:checked]:border-[#81C784] has-[:checked]:bg-[#E8F5E9] transition-all">
                                <input type="radio" name="tx-type" value="income" checked class="hidden"> 🟢 Pemasukan
                            </label>
                            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2.5 text-center block text-sm font-medium has-[:checked]:border-[#E57373] has-[:checked]:bg-[#FFEBEE] transition-all">
                                <input type="radio" name="tx-type" value="expense" class="hidden"> 🔴 Pengeluaran
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Kategori</label>
                        <select id="tx-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#D1C4E9] bg-slate-50/50 text-sm">
                            <option value="Makanan">🍲 Makanan & Minuman</option>
                            <option value="Edukasi">📚 Edukasi / Sekolah</option>
                            <option value="Hiburan">🎮 Hiburan & Game</option>
                            <option value="Transportasi">🚌 Transportasi</option>
                            <option value="Gaji">💰 Gaji / Uang Jajan</option>
                            <option value="Lainnya">🧩 Lainnya</option>
                        </select>
                    </div>

                    <button type="submit" 
                        class="w-full bg-[#D1C4E9] hover:bg-[#B39DDB] text-[#4A148C] font-semibold py-2.5 rounded-xl shadow-sm transition-colors text-sm mt-2">
                        Tambah Transaksi
                    </button>
                </form>
            </div>

            <div class="md:col-span-3 space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap items-center justify-between gap-3">
                    <span class="text-sm font-medium text-slate-600">Riwayat Transaksi</span>
                    <select id="filter-category" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs focus:outline-none bg-slate-50">
                        <option value="all">Semua Kategori</option>
                        <option value="Makanan">🍲 Makanan</option>
                        <option value="Edukasi">📚 Edukasi</option>
                        <option value="Hiburan">🎮 Hiburan</option>
                        <option value="Transportasi">🚌 Transportasi</option>
                        <option value="Gaji">💰 Gaji</option>
                        <option value="Lainnya">🧩 Lainnya</option>
                    </select>
                </div>

                <div id="transaction-list" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                    </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
